name: Plot Workbench Windows

on:
  push:
    branches: [workbench/v1]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  TAVOTTO_NO_TELEMETRY: "1"
  TAVOTTO_NO_UPDATE_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.27.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            src-tauri
            workerd
          shared-key: workbench-windows
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[worker,workbench]" pyinstaller pytest "ruff>=0.16,<0.17"
          pnpm --dir web install --frozen-lockfile
      - name: Verify backend and fork packaging
        run: |
          cargo test --manifest-path workerd/Cargo.toml
          $workbenchTests = @(Get-ChildItem tests/test_workbench*.py -File | ForEach-Object FullName)
          if ($workbenchTests.Count -eq 0) { throw "Workbench backend tests were not found" }
          python -m pytest -q $workbenchTests tests/test_updater_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "Workbench backend tests failed" }
          pnpm --dir web exec vitest run src/workbench src/components/settings/updateStates.test.tsx src/store/updateStore.test.ts src/lib/desktop.golden.test.ts src/hooks/menuActions.test.tsx
          if ($LASTEXITCODE -ne 0) { throw "Workbench frontend tests failed" }
          python -m ruff check src/tavotto/workbench tests/test_workbench_api.py tests/test_workbench_data.py tests/test_workbench_rendering.py tests/test_workbench_store.py tests/test_workbench_tavotto.py tests/test_workbench_packaging.py tests/test_workbench_release_workflow.py tests/test_updater_manifest.py scripts/workbench_api_smoke.py scripts/workbench_build.py scripts/workbench_brand_assets.py scripts/workbench_generate_examples.py scripts/workbench_installer_smoke.py scripts/make_updater_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "Workbench lint failed" }
          pnpm --dir web lint
          if ($LASTEXITCODE -ne 0) { throw "Frontend lint failed" }
      - name: Build Windows installer
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: python scripts/workbench_build.py
      - name: Build signed Windows updater release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: python scripts/workbench_build.py --release-tag $env:GITHUB_REF_NAME
      - name: Verify updater signature matches embedded public key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $signatures = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.nsis.zip.sig')
          if ($signatures.Count -ne 1) { throw "Expected one signed updater archive, found $($signatures.Count)" }
          python scripts/check_updater_key.py --conf build/workbench-tauri-release.json --sig $signatures[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Updater signature does not match the embedded public key" }
      - name: Check frozen PDF backend and license closure
        run: python scripts/ci/retirement_scan.py --dist dist/Tavotto
      - name: Install and verify without system Python on PATH
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter 'Plot-Workbench-*-Windows-x64-Setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one Workbench installer, found $($installers.Count)" }
          python scripts/workbench_installer_smoke.py --installer $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer smoke test failed" }
      - name: Upload verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plot-Workbench-Installer
          path: |
            dist/Plot-Workbench-*-Windows-x64-Setup.exe
            dist/Plot-Workbench-*-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload signed updater archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plot-Workbench-Updater
          path: src-tauri/target/release/bundle/nsis/*.nsis.zip*
          if-no-files-found: error
          retention-days: 2
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plot-Workbench-build-diagnostics
          path: |
            build/Tavotto/warn-*.txt
            build/workbench-installer-smoke/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain unverified candidate for local diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UNVERIFIED-Windows-candidate
          path: |
            dist/Plot-Workbench-*-Windows-x64-Setup.exe*
            src-tauri/target/release/bundle/nsis/*.nsis.zip*
            build/workbench-tauri-release.json
          if-no-files-found: ignore
          retention-days: 1

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download verified build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name Plot-Workbench-Installer --dir release-assets/installer
          gh run download "$GITHUB_RUN_ID" --name Plot-Workbench-Updater --dir release-assets/updater
      - name: Verify installer checksum
        run: |
          cd release-assets/installer
          sha256sum -c *.sha256
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/workbench/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            cp -- "$notes" release-notes.md
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              --field tag_name="${GITHUB_REF_NAME}" \
              --field target_commitish="${GITHUB_SHA}" \
              --jq .body > release-notes.md
          fi
      - name: Validate signed update manifest
        run: >-
          python3 scripts/make_updater_manifest.py
          --artifacts release-assets/updater
          --tag "$GITHUB_REF_NAME"
          --require windows-x86_64
          --notes-file release-notes.md
          --out release-assets/latest.json
      - name: Publish stable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/installer/* \
            release-assets/updater/* \
            release-assets/latest.json \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --notes-file release-notes.md
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release-metadata.json
          python3 scripts/make_updater_manifest.py \
            --artifacts release-assets/updater --tag "$GITHUB_REF_NAME" \
            --require windows-x86_64 --notes-file release-notes.md \
            --out release-assets/latest.json --published-release release-metadata.json
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
