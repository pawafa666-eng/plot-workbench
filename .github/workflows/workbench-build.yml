name: Plot Workbench Windows

on:
  push:
    branches: [workbench/v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  TAVOTTO_NO_TELEMETRY: "1"
  TAVOTTO_NO_UPDATE_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.27.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            src-tauri
            workerd
          shared-key: workbench-windows
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[worker,workbench]" pyinstaller pytest "ruff>=0.16,<0.17"
          pnpm --dir web install --frozen-lockfile
      - name: Verify backend and fork packaging
        run: |
          cargo test --manifest-path workerd/Cargo.toml
          $workbenchTests = @(Get-ChildItem tests/test_workbench*.py -File | ForEach-Object FullName)
          if ($workbenchTests.Count -eq 0) { throw "Workbench backend tests were not found" }
          python -m pytest -q $workbenchTests
          if ($LASTEXITCODE -ne 0) { throw "Workbench backend tests failed" }
          pnpm --dir web exec vitest run src/workbench
          if ($LASTEXITCODE -ne 0) { throw "Workbench frontend tests failed" }
          python -m ruff check src/tavotto/workbench tests/test_workbench_api.py tests/test_workbench_data.py tests/test_workbench_rendering.py tests/test_workbench_store.py tests/test_workbench_tavotto.py tests/test_workbench_packaging.py scripts/workbench_api_smoke.py scripts/workbench_build.py scripts/workbench_brand_assets.py scripts/workbench_generate_examples.py scripts/workbench_installer_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Workbench lint failed" }
          pnpm --dir web lint
          if ($LASTEXITCODE -ne 0) { throw "Frontend lint failed" }
      - name: Build Windows installer with private scientific runtime
        run: python scripts/workbench_build.py
      - name: Check frozen PDF backend and license closure
        run: python scripts/ci/retirement_scan.py --dist dist/Tavotto
      - name: Install and verify without system Python on PATH
        run: python scripts/workbench_installer_smoke.py --installer dist/Plot-Workbench-1.0.0-Windows-x64-Setup.exe
      - name: Upload verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plot-Workbench-1.0.0-Windows-x64
          path: |
            dist/Plot-Workbench-1.0.0-Windows-x64-Setup.exe
            dist/Plot-Workbench-1.0.0-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Plot-Workbench-build-diagnostics
          path: |
            build/Tavotto/warn-*.txt
            build/workbench-installer-smoke/**
          if-no-files-found: ignore
          retention-days: 7
